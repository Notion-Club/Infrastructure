<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --transition-timing: cubic-bezier(0.76, 0, 0.24, 1);
    }
    
    .font-inter {
      font-family: 'Inter', sans-serif;
    }

    @keyframes slide-up {
      0%, 20% { transform: translateY(0); }
      30%, 70% { transform: translateY(-50%); }
      80%, 100% { transform: translateY(0); }
    }

    @keyframes slide-up-delayed {
      0%, 25% { transform: translateY(0); }
      35%, 75% { transform: translateY(-50%); }
      85%, 100% { transform: translateY(0); }
    }

    .animate-word-stack {
      animation: slide-up 6s var(--transition-timing) infinite;
    }

    .animate-word-stack-delayed {
      animation: slide-up-delayed 6s var(--transition-timing) infinite;
    }
  </style>
</head>
<body>
  <div class="min-h-screen bg-[#fcfcfc] flex items-center justify-center p-8">
    <div class="w-full text-center font-inter">
      <h1 class="text-[42px] md:text-[64px] font-semibold tracking-[-0.04em] leading-tight text-black flex flex-wrap justify-center items-center gap-y-2">
        <span class="inline-flex items-center">
          <span class="relative inline-block h-[1.2em] overflow-hidden align-bottom text-right min-w-[190px] md:min-w-[260px]">
            <span class="animate-word-stack flex flex-col">
              <span class="h-[1.2em] flex items-center justify-end">Think</span>
              <span class="h-[1.2em] flex items-center justify-end">Imagine</span>
            </span>
          </span>
          <span class="mr-4">it.</span>
        </span>

        <span class="inline-flex items-center">
          <span class="relative inline-block h-[1.2em] overflow-hidden align-bottom text-right min-w-[190px] md:min-w-[260px]">
            <span class="animate-word-stack-delayed flex flex-col">
              <span class="h-[1.2em] flex items-center justify-end">Explore</span>
              <span class="h-[1.2em] flex items-center justify-end">Iterate</span>
            </span>
          </span>
          <span>it.</span>
        </span>
      </h1>
    </div>
  </div>
</body>
</html>
