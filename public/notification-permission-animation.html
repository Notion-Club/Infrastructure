<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notion Club — aperçu notifications écran verrouillé</title>
<style>
/* =====================================================================
   SCÈNE iOS écran verrouillé — lifée du modal « Active les notifications ».
   Isolée dans une iframe (cf. NotificationPermissionModal.tsx → .nc-pwa-anim).
   Fond TRANSPARENT : on laisse transparaître la zone d'animation claire du
   modal hôte (guide en light mode quel que soit le thème).
   ===================================================================== */
:root{
  --color-brand:#e0625a;
  --color-text-primary:#000000;
  --color-text-secondary:#52525b;
  --color-surface-page:#f5f2f2;
}

/* ===== SF Pro Display — fallback -apple-system natif sur Apple ===== */
@font-face{ font-family:"SF Pro Display"; font-style:normal; font-weight:400; font-display:swap;
  src:local("SF Pro Display"), local("SFProDisplay-Regular"), url("fonts/SF-Pro-Display-Regular.woff2") format("woff2"); }
@font-face{ font-family:"SF Pro Display"; font-style:normal; font-weight:700; font-display:swap;
  src:local("SF Pro Display Bold"), local("SFProDisplay-Bold"), url("fonts/SF-Pro-Display-Bold.woff2") format("woff2"); }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  min-height:100%;
  background:transparent;
  font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  color:var(--color-text-primary);
}

/* Stage = toute l'iframe ; téléphone ancré EN BAS (on garde le bas du
   téléphone : notifications + contrôles lampe/photo + coins arrondis). */
.anim-stage{ position:fixed; inset:0; display:flex; align-items:flex-end; justify-content:center; overflow:hidden; }
.scene{ transform-origin:bottom center; }

/* Recadrage : on rogne SEULEMENT le HAUT (l'ex-« zone rose » de wallpaper
   au-dessus des notifications) en réduisant --view-h, tout en gardant le BAS
   complet (--gap-bottom → coins arrondis + ombre + contrôles + home visibles).
   Une fine bande de wallpaper reste au-dessus des notifications : c'est sur
   elle que repose la croix liquid-glass, sans chevaucher les notifications. */
.frame{ position:relative; --view-h:390px; --gap-x:18px; --gap-bottom:32px;
  width:calc(402px + var(--gap-x) * 2); height:calc(var(--view-h) + var(--gap-bottom)); overflow:hidden; }
.frame .ncb-phone{ position:absolute; left:var(--gap-x); bottom:var(--gap-bottom); margin:0; }

/* Coque téléphone — radius/ombre repris de .ncb-phone. */
.ncb-phone{
  position:relative; width:402px; height:874px; margin:0 auto;
  border-radius:56px; overflow:hidden;
  /* WALLPAPER = halo riche du guide d'install (.ncb-halo) : 4 coins + 2 côtés. */
  background:
    radial-gradient(circle at 0% 0%,   rgba(224,99,90,0.28) 0%, transparent 35%),
    radial-gradient(circle at 100% 0%, rgba(224,99,90,0.24) 0%, transparent 34%),
    radial-gradient(circle at 0% 100%, rgba(224,99,90,0.22) 0%, transparent 34%),
    radial-gradient(circle at 100% 100%,rgba(224,99,90,0.26) 0%, transparent 35%),
    radial-gradient(ellipse at 0% 50%,  rgba(224,99,90,0.12) 0%, transparent 20%),
    radial-gradient(ellipse at 100% 50%,rgba(224,99,90,0.12) 0%, transparent 20%),
    var(--color-surface-page);
  box-shadow:0 2px 8px rgba(0,0,0,0.05), 0 14px 34px -20px rgba(40,20,20,0.30), 0 0 0 1px rgba(0,0,0,0.04);
  font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; isolation:isolate;
}
.ncb-phone *, .ncb-phone *::before, .ncb-phone *::after{ box-sizing:border-box; }

/* Status bar (cropée, présente pour cohérence) — icônes sombres sur wallpaper clair. */
.ls-status{ position:absolute; top:0; left:0; right:0; height:54px; z-index:10; }
.ls-status .ic{ position:absolute; right:22px; top:19px; display:flex; align-items:center; gap:7px; }

/* ===== NOTIFICATIONS — verre clair iOS (wallpaper light), texte sombre =====
   2 emplacements : HAUT (translateY 0) / BAS (translateY 72px).
   Notif A (la 1re, « 9:41 ») entre en BAS, puis REMONTE en HAUT quand la
   notif B (« maintenant », plus récente) prend sa place en BAS. */
.ls-notifs{ position:absolute; left:15px; right:15px; top:560px; height:136px; z-index:6; }
.ls-notif{
  position:absolute; left:0; right:0; top:0;
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; min-height:64px; border-radius:24px;
  background:rgba(255,255,255,0.58);
  -webkit-backdrop-filter:blur(30px) saturate(180%); backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 8px 30px rgba(40,20,20,0.12), inset 0 0 0 .5px rgba(255,255,255,0.7), inset 0 1px 1px rgba(255,255,255,0.6);
  opacity:0; will-change:transform,opacity,filter;
}
.ls-notif .ico{ flex:0 0 auto; width:38px; height:38px; border-radius:9px; overflow:hidden;
  background:var(--color-brand); box-shadow:0 1px 3px rgba(0,0,0,.18); }
.ls-notif .ico img{ width:100%; height:100%; object-fit:cover; display:block; }
.ls-notif .body{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:1px; }
.ls-notif .ttl{ font-size:15px; font-weight:700; line-height:18px; letter-spacing:-0.23px; color:#1b1b1b;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ls-notif .msg{ font-size:15px; font-weight:400; line-height:18px; letter-spacing:-0.23px; color:#5c5c61;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ls-notif .time{ flex:0 0 auto; align-self:flex-start; margin-top:1px;
  font-size:15px; font-weight:400; letter-spacing:-0.2px; color:#8a8a8e; }

.ls-notif--a{ animation:notifA 8s infinite; }
.ls-notif--b{ animation:notifB 8s infinite; }

/* A : entre en BAS (72) → remonte en HAUT (0) → sortie ease-out. Vide ~0,7s. */
@keyframes notifA{
  0%   { opacity:0; transform:translateY(58px) scale(.96); filter:blur(0); }
  2%   { opacity:0; transform:translateY(58px) scale(.96); animation-timing-function:cubic-bezier(.34,1.4,.5,1); }
  9%   { opacity:1; transform:translateY(72px) scale(1); }
  24%  { opacity:1; transform:translateY(72px) scale(1); animation-timing-function:cubic-bezier(.22,1,.36,1); }
  31%  { opacity:1; transform:translateY(0px)  scale(1); }
  84%  { opacity:1; transform:translateY(0px)  scale(1); filter:blur(0); animation-timing-function:cubic-bezier(.4,0,.2,1); }
  93%  { opacity:0; transform:translateY(-7px) scale(1); filter:blur(2px); }
  100% { opacity:0; transform:translateY(58px) scale(.96); filter:blur(0); }
}
/* B : entre en BAS (72) au moment où A remonte → reste en BAS → sortie ease-out */
@keyframes notifB{
  0%   { opacity:0; transform:translateY(58px) scale(.96); filter:blur(0); }
  24%  { opacity:0; transform:translateY(58px) scale(.96); animation-timing-function:cubic-bezier(.34,1.4,.5,1); }
  31%  { opacity:1; transform:translateY(72px) scale(1); }
  84%  { opacity:1; transform:translateY(72px) scale(1); filter:blur(0); animation-timing-function:cubic-bezier(.4,0,.2,1); }
  93%  { opacity:0; transform:translateY(65px) scale(1); filter:blur(2px); }
  100% { opacity:0; transform:translateY(58px) scale(.96); filter:blur(0); }
}

/* Contrôles (lampe / appareil photo) — VRAIS icônes SVG fournis. */
.ls-controls{ position:absolute; left:46px; right:46px; top:766px; height:58px; z-index:5;
  display:flex; justify-content:space-between; align-items:center; }
.ls-ctrl{ width:58px; height:58px; border-radius:100px;
  background:rgba(255,255,255,0.5);
  -webkit-backdrop-filter:blur(14px) saturate(160%); backdrop-filter:blur(14px) saturate(160%);
  box-shadow:0 8px 30px rgba(40,20,20,0.10), inset 0 0 0 .5px rgba(255,255,255,0.6);
  display:flex; align-items:center; justify-content:center; color:#1b1b1b; }
.ls-ctrl svg{ display:block; }

/* Home indicator — sombre sur wallpaper clair. */
.ls-home{ position:absolute; left:50%; transform:translateX(-50%); bottom:9px;
  width:144px; height:5px; border-radius:100px; background:#1b1b1b; opacity:.32; z-index:7; }

/* Réduction de mouvement : on fige l'état final (A en haut, B en bas). */
@media (prefers-reduced-motion: reduce){
  .ls-notif{ animation:none !important; opacity:1 !important; filter:none !important; }
  .ls-notif--a{ transform:translateY(0) !important; }
  .ls-notif--b{ transform:translateY(72px) !important; }
}
</style>

<script>
/* Mise à l'échelle « contain » de la scène DANS l'iframe (zone .nc-pwa-anim du
   modal hôte) → l'animation remplit le split haut du modal, ancrée en bas. */
(function(){
  var stage = document.getElementById('stage');
  var scene = document.getElementById('scene');
  var frame = document.getElementById('frame');
  function fit(){
    var fw = frame.offsetWidth, fh = frame.offsetHeight;
    var cw = stage.clientWidth, ch = stage.clientHeight;
    if(!fw || !fh || !cw || !ch) return;
    var s = Math.min(cw / fw, ch / fh);
    scene.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit, {passive:true});
  if(window.ResizeObserver){ new ResizeObserver(fit).observe(stage); }
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fit); }
  fit();
})();
</script>
